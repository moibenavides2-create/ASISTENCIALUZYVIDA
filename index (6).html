<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<title>Asistencia · Fundación Luz y Vida</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#9eeeff;--card:#ffffffd9;--tx:#1c1a1a;--mut:#3d5a66;--ln:#7cc9de;--ac:#0e7fa3;--ac2:#0b5f7a;--girl:#d6508a;--boy:#1f6fd0;--ok:#16905a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#fff 0,#c9f6ff 30%,var(--bg) 70%) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.w{max-width:980px;margin:0 auto;padding:16px}
h1{margin:0;font-size:2rem;font-family:"Great Vibes","Pinyon Script",cursive;font-weight:400}.hd{display:flex;gap:14px;align-items:center;margin-bottom:8px}.hd img{width:78px;height:auto;border-radius:12px;border:1px solid var(--ln)}
.sub{color:var(--mut);font-size:.9rem;margin:2px 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
.tabs button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font-size:.95rem}
.btn{padding:8px 14px;border:0;border-radius:8px;background:var(--ac2);color:#fff;cursor:pointer;font-size:.95rem}
.btn.x{background:transparent;color:var(--mut);padding:2px 8px;border:1px solid var(--ln)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
td input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.bar{height:22px;border-radius:6px;min-width:2px}
.bl{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;color:#fff}
.t-oro{background:#c9961a}.t-plata{background:#7d8794}.t-bronce{background:#a8672f}.t-part{background:var(--ac2)}
.g{color:var(--girl)}.b{color:var(--boy)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dot{padding:8px 10px;border-radius:10px;border:1px solid var(--ln);font-size:.85rem;color:var(--mut)}
.dot.y{background:var(--ok);color:#fff;border-color:var(--ok)}
.hint{color:var(--mut);font-size:.85rem}
.big{font-size:2rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid .card{margin:0;text-align:center}
</style>
</head>

    h+='<tr><td>'+esc(k.name)+' <small>'+gi(k)+'</small></td><td><input type="number" min="0" max="18" style="width:60px" data-age="'+k.id+'" value="'+esc(k.age||'')+'"></td>'+DAYS.map(function(d){return '<td><input type="checkbox" data-k="'+k.id+'" data-d="'+d+'"'+(k.att&&k.att[d]?" checked":"")+'></td>'}).join("")+'<td><b>'+cnt(k)+'</b></td><td><button class="btn x" data-del="'+k.id+'">✕</button></td></tr>';
  });
  var tot=DAYS.map(function(d){return S.kids.filter(function(k){return k.att&&k.att[d]}).length});
  h+='<tr><td><b>Asistentes por día</b></td><td></td>'+tot.map(function(n){return '<td><b>'+n+'</b></td>'}).join("")+'<td></td><td></td></tr></table></div>';
  return h;
}
function rRank(){
  var s=sorted(),T=S.tiers;
  var h='<div class="card"><b>Niveles de regalo</b> <span class="hint">(días mínimos de asistencia)</span><div class="row" style="margin-top:8px">'+
  '<label>Oro <input type="number" min="1" max="9" style="width:64px" data-tr="oro" value="'+T.oro+'"></label>'+
  '<label>Plata <input type="number" min="1" max="9" style="width:64px" data-tr="plata" value="'+T.plata+'"></label>'+
  '<label>Bronce <input type="number" min="1" max="9" style="width:64px" data-tr="bronce" value="'+T.bronce+'"></label>'+
  '<span class="hint">Menos que Bronce: Participación</span></div></div>';
  if(!s.length)return h+'<div class="card hint">Sin datos todavía.</div>';
  h+='<div class="card sc"><table><tr><th>Puesto · Nombre</th><th>Edad</th><th>Días</th><th>Regalo</th></tr>';
  s.forEach(function(k,i){var n=cnt(k),r=tier(n);h+='<tr><td>'+(i+1)+'. '+esc(k.name)+'</td><td>'+(k.age?esc(k.age)+' años':'–')+'</td><td><b>'+n+'</b> / '+DAYS.length+'</td><td><span class="tag '+r[1]+'">'+r[0]+'</span></td></tr>'});
  return h+'</table></div>';
}
function rKid(){
  if(!S.kids.length)return '<div class="card hint">Agrega niños en la pestaña Registro.</div>';
  var s=S.kids.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  if(!sel||!S.kids.some(function(k){return k.id===sel}))sel=s[0].id;
  var k=S.kids.filter(function(x){return x.id===sel})[0],n=cnt(k),r=tier(n);
  var h='<div class="card"><select id="ks" style="width:100%">'+s.map(function(x){return '<option value="'+x.id+'"'+(x.id===sel?" selected":"")+'>'+esc(x.name)+'</option>'}).join("")+'</select></div>';
  h+='<div class="card"><div class="row" style="justify-content:space-between"><div><div style="font-size:1.2rem"><b>'+esc(k.name)+'</b> · '+gi(k)+(k.age?' · '+esc(k.age)+' años':'')+'</div><div class="big">'+n+' <span class="hint" style="font-size:1rem">de '+DAYS.length+' días</span></div></div><span class="tag '+r[1]+'">Regalo: '+r[0]+'</span></div>';
  h+='<div class="dots">'+DAYS.map(function(d){var y=k.att&&k.att[d];return '<div class="dot'+(y?" y":"")+'">'+d+' dic '+(y?"✓":"–")+'</div>'}).join("")+'</div></div>';
  return h;
}
function rGraf(){
  if(!S.kids.length)return '<div class="card hint">Sin datos todavía.</div>';
  var f=S.kids.filter(function(k){return k.g==="F"}).length,m=S.kids.length-f,mx=Math.max(f,m,1);
  function bar(l,n,m2,c){return '<div class="bl"><span>'+l+'</span><div><div class="bar" style="width:'+(n/m2*100)+'%;background:'+c+'"></div></div><b>'+n+'</b></div>'}
  var h='<div class="grid"><div class="card"><div class="hint">Total</div><div class="big">'+S.kids.length+'</div></div><div class="card"><div class="hint">Niñas</div><div class="big g">'+f+'</div></div><div class="card"><div class="hint">Niños</div><div class="big b">'+m+'</div></div></div><div style="height:14px"></div>';
  h+='<div class="card"><b>Niñas y niños</b>'+bar("Niñas",f,mx,"var(--girl)")+bar("Niños",m,mx,"var(--boy)")+'</div>';
  var tc={Oro:0,Plata:0,Bronce:0,"Participación":0};S.kids.forEach(function(k){tc[tier(cnt(k))[0]]++});
  var mt=Math.max.apply(null,Object.keys(tc).map(function(x){return tc[x]}).concat(1));
  h+='<div class="card"><b>Niños por nivel de regalo</b>'+Object.keys(tc).map(function(x){return bar(x,tc[x],mt,"var(--ac)")}).join("")+'</div>';
  var pd=DAYS.map(function(d){return S.kids.filter(function(k){return k.att&&k.att[d]}).length}),mp=Math.max.apply(null,pd.concat(1));
  h+='<div class="card"><b>Asistencia por día</b>'+DAYS.map(function(d,i){return bar(d+" dic",pd[i],mp,"var(--ac2)")}).join("")+'</div>';
  var top=sorted().slice(0,5);
  h+='<div class="card"><b>Mayor asistencia (top 5)</b>'+top.map(function(k){return bar(esc(k.name),cnt(k),DAYS.length,"var(--ok)")}).join("")+'</div>';
  return h;
}

document.addEventListener("click",function(e){
  var el=e.target;
  if(el.dataset.t){tab=el.dataset.t;render();return}
  if(el.id==="lgb"){firebase.auth().signInWithEmailAndPassword(document.getElementById("le").value.trim(),document.getElementById("lp").value).catch(function(){alert("Correo o contraseña incorrectos.")});return}
  if(el.id==="add"){var n=document.getElementById("nn").value.trim();if(!n)return;S.kids.push({id:"k"+Date.now(),name:n,g:document.getElementById("ng").value,age:document.getElementById("na").value,att:{}});save();render();return}
  if(el.dataset.del){var k=S.kids.filter(function(x){return x.id===el.dataset.del})[0];if(k&&confirm("¿Eliminar a "+k.name+"?")){S.kids=S.kids.filter(function(x){return x!==k});save();render()}}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset.k){var k=S.kids.filter(function(x){return x.id===el.dataset.k})[0];k.att=k.att||{};k.att[el.dataset.d]=el.checked;save();render()}
  else if(el.dataset.age){var q=S.kids.filter(function(x){return x.id===el.dataset.age})[0];q.age=el.value;save();render()}
  else if(el.dataset.tr){S.tiers[el.dataset.tr]=Math.max(1,parseInt(el.value)||1);save();render()}
  else if(el.id==="ks"){sel=el.value;render()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="nn")document.getElementById("add").click()});

try{var l=localStorage.getItem("luzyvida");if(l)S=JSON.parse(l)}catch(e){}
render();
(async function(){
  try{
    if(!window.claude)return;
    db=await claude.use("db");
    if(!db)return;
    ref=db.doc("campana/estado");
    var timer=setTimeout(function(){},10000);
    ref.onSnapshot(function(s){
      clearTimeout(timer);
      if(s.exists){var d=s.data();S={kids:d.kids||[],tiers:d.tiers||S.tiers};render()}
      else if(S.kids.length){ref.set(S)}
      document.getElementById("st").textContent="· datos guardados";
    },function(){});
  }catch(e){}
})();

function startFirebase(){
  if(!window.firebase||FB.apiKey==="PEGA_AQUI")return;
  firebase.initializeApp(FB);
  firebase.auth().onAuthStateChanged(function(u){
    if(!u){LOGIN=true;render();return}
    LOGIN=false;render();
    ref=firebase.firestore().doc("campana/estado");
    ref.onSnapshot(function(s){
      if(s.exists){var d=s.data();S={kids:d.kids||[],tiers:d.tiers||S.tiers};render()}
      else if(S.kids.length){ref.set(S)}
      document.getElementById("st").textContent="· datos guardados en la nube";
    },function(){document.getElementById("st").textContent="· sin conexión o sin permiso"});
  });
}
startFirebase();
</script>
